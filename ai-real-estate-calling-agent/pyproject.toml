
[project]
name = "ai-real-estate-calling-agent"
version = "0.1.0"
description = "Production-grade low-cost AI Real Estate Cold Calling Agent (Hinglish), deterministic state-machine + LLM fallback, provider-abstracted telephony/STT/TTS/LLM."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Real Estate AI Agent Team" }]
keywords = [
    "ai",
    "voice-agent",
    "cold-calling",
    "real-estate",
    "hinglish",
    "fastapi",
    "postgresql",
    "sarvam",
    "gemini",
    "plivo",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Communications :: Telephony",
]

dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.14.0",
    "audioop-lts>=0.2.1; python_version >= '3.13'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = ["app", "tests", "alembic", "docs", "scripts", ".env.example"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# `live` tests hit real (paid) providers. They are SKIPPED by default so normal
# `pytest` stays cost-free. Run them explicitly and only when deliberately
# testing against real providers: `pytest -m live` with RUN_LIVE_TESTS=true.
markers = [
    "live: tests that make real (paid) external calls; opt-in via -m live and RUN_LIVE_TESTS=true",
]
# Default: deselect live tests so a plain `pytest` never pays.
addopts = "-m 'not live'"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "pass",
    "raise NotImplementedError",
]
